apiVersion: v1
kind: Pod
metadata:
  name: dind-pod-aks-remount
spec:
  hostUsers: false
  containers:
    - name: docker
      image: snehapark4appssacr.azurecr.io/dind:v11
      args:
        - "https://github.com/snehapar9/compose-for-agents.git"
        - "compose-for-agents/langchaingo"
      securityContext:
        capabilities:
          add: ["SYS_ADMIN", "NET_ADMIN"]
      volumeMounts:
        - mountPath: /var/lib/docker
          name: docker-volume
        - mountPath: /var/run
          name: docker-run
      resources:
        requests: { cpu: 250m, memory: 0.5Gi }
        limits: { cpu: 4000m, memory: 8Gi, ephemeral-storage: 40Gi }
    - name: dozzle
      image: amir20/dozzle:latest
      args: ["--addr=:9000"]
      ports:
        - containerPort: 9000
          name: http
      env:
        - name: DOCKER_HOST
          value: "unix:///var/run/docker.sock"
      volumeMounts:
        - name: docker-run
          mountPath: /var/run
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
  volumes:
    - name: docker-volume
      emptyDir: {}
    - name: docker-run
      emptyDir: {}
